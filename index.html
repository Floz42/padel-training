<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A5C86">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Prépa padel">
<meta name="mobile-web-app-capable" content="yes">
<title>Prépa padel</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap');

:root{
  --ink:#08293D;
  --field:#E7EFF3;
  --card:#FFFFFF;
  --line:#0A5C86;
  --rail:#C2D5DF;
  --ball:#C6E23F;
  --muted:#5C7C8E;
  --warn:#B5451B;
  --display:'Barlow Condensed','Arial Narrow',Impact,system-ui,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --data:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--field);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.45;
  padding-bottom:96px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- header ---------- */
header{
  background:var(--line);
  color:#fff;
  padding:18px 0 16px;
  border-bottom:3px solid var(--ball);
}
.brand{
  font-family:var(--display);
  font-weight:700;
  font-size:clamp(30px,9vw,44px);
  letter-spacing:.02em;
  text-transform:uppercase;
  line-height:.95;
  margin:0;
}
.brand span{color:var(--ball)}
.tag{
  font-family:var(--data);
  font-size:11px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#9FC4D6;
  margin-top:6px;
}

/* ---------- controls ---------- */
.controls{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.ctl-label{
  font-family:var(--data);
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:5px;
}
.seg{display:flex;gap:6px}
.seg button{
  flex:1;
  font-family:var(--display);
  font-size:19px;
  font-weight:600;
  letter-spacing:.03em;
  text-transform:uppercase;
  padding:12px 4px 10px;
  background:var(--card);
  color:var(--ink);
  border:2px solid var(--rail);
  border-radius:2px;
  cursor:pointer;
  transition:background .12s,border-color .12s;
}
.seg button .sub{
  display:block;
  font-family:var(--data);
  font-size:10px;
  font-weight:400;
  letter-spacing:.06em;
  color:var(--muted);
  text-transform:none;
  margin-top:1px;
}
.seg button[aria-pressed="true"]{
  background:var(--ink);
  border-color:var(--ink);
  color:#fff;
}
.seg button[aria-pressed="true"] .sub{color:var(--ball)}
.seg button:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

.row2{display:flex;gap:10px}
.row2>div{flex:1}
select{
  width:100%;
  font-family:var(--body);
  font-size:15px;
  padding:10px;
  border:2px solid var(--rail);
  border-radius:2px;
  background:var(--card);
  color:var(--ink);
}

/* ---------- session note ---------- */
.note{
  margin-top:12px;
  background:#DCE8EE;
  border-left:4px solid var(--line);
  padding:10px 12px;
  font-size:14px;
}
.note strong{font-weight:600}

/* ---------- blocks ---------- */
.bloc{margin-top:26px}
.bloc-head{
  display:flex;
  align-items:baseline;
  gap:10px;
  border-bottom:2px solid var(--ink);
  padding-bottom:4px;
  margin-bottom:2px;
}
.bloc-head h2{
  font-family:var(--display);
  text-transform:uppercase;
  font-size:22px;
  font-weight:700;
  letter-spacing:.03em;
  margin:0;
}
.bloc-head .meta{
  font-family:var(--data);
  font-size:10px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  margin-left:auto;
}

/* ---------- rail + exercise ---------- */
.rail{position:relative;padding-left:26px}
.rail::before{
  content:'';
  position:absolute;
  left:8px;top:6px;bottom:6px;
  width:2px;
  background:var(--rail);
}
.ex{
  position:relative;
  background:var(--card);
  border:2px solid var(--rail);
  border-radius:2px;
  padding:12px 12px 10px;
  margin:10px 0;
}
.ex::before{
  content:'';
  position:absolute;
  left:-22px;top:20px;
  width:12px;height:12px;
  border-radius:50%;
  background:var(--field);
  border:2px solid var(--rail);
}
.ex.done{border-color:var(--line)}
.ex.done::before{background:var(--ball);border-color:var(--line)}
.ex.beyond{opacity:.45}

.ex-top{display:flex;gap:10px;align-items:flex-start}
.ex-name{
  font-family:var(--display);
  font-size:21px;
  font-weight:600;
  line-height:1.05;
  letter-spacing:.01em;
  flex:1;
}
.chk{
  width:34px;height:34px;flex:none;
  border:2px solid var(--rail);
  border-radius:2px;
  background:var(--card);
  cursor:pointer;
  font-size:18px;
  line-height:1;
  color:var(--line);
}
.chk[aria-pressed="true"]{background:var(--ball);border-color:var(--line)}
.chk:focus-visible{outline:3px solid var(--line);outline-offset:2px}

.presc{
  display:flex;gap:8px;flex-wrap:wrap;
  margin-top:8px;
}
.pill{
  font-family:var(--data);
  font-size:12px;
  letter-spacing:.04em;
  padding:4px 8px;
  background:var(--field);
  border-radius:2px;
}
.pill.sets{background:var(--ink);color:#fff}
button.pill.rest{
  border:2px solid var(--line);
  background:var(--card);
  color:var(--line);
  cursor:pointer;
  font-family:var(--data);
}
button.pill.rest:focus-visible{outline:3px solid var(--ball);outline-offset:2px}
button.pill.work{
  border:2px solid var(--ink);
  background:var(--ball);
  color:var(--ink);
  cursor:pointer;
  font-family:var(--data);
  font-weight:600;
}
button.pill.work:focus-visible{outline:3px solid var(--line);outline-offset:2px}

.ex-note{
  margin-top:8px;
  font-size:13.5px;
  color:var(--warn);
  border-left:3px solid var(--warn);
  padding-left:8px;
}

.inputs{display:flex;gap:8px;margin-top:10px}
.inputs label{flex:1}
.inputs .ctl-label{margin-bottom:3px}
.inputs input{
  width:100%;
  font-family:var(--data);
  font-size:15px;
  padding:8px;
  border:2px solid var(--rail);
  border-radius:2px;
  background:#F7FAFB;
  color:var(--ink);
}
.inputs input:focus{outline:none;border-color:var(--line);background:#fff}
.last{
  font-family:var(--data);
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}
.last b{color:var(--ink);font-weight:600}

.cut{
  position:relative;
  margin:18px 0 8px;
  border-top:2px dashed var(--line);
  text-align:center;
}
.cut span{
  position:relative;top:-10px;
  background:var(--field);
  padding:0 10px;
  font-family:var(--data);
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--line);
}

/* ---------- footer actions ---------- */
.actions{margin-top:28px;display:flex;gap:10px;flex-wrap:wrap}
.btn{
  font-family:var(--display);
  text-transform:uppercase;
  letter-spacing:.04em;
  font-size:18px;
  font-weight:600;
  padding:13px 18px;
  border:2px solid var(--ink);
  border-radius:2px;
  background:var(--ink);
  color:#fff;
  cursor:pointer;
  flex:1;
}
.btn.ghost{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:3px solid var(--ball);outline-offset:2px}

.hist{margin-top:30px;border-top:2px solid var(--ink);padding-top:10px}
.hist h2{
  font-family:var(--display);
  text-transform:uppercase;
  font-size:20px;
  margin:0 0 8px;
}
.hist-row{
  display:flex;gap:10px;align-items:baseline;
  font-family:var(--data);
  font-size:12.5px;
  padding:6px 0;
  border-bottom:1px solid var(--rail);
}
.hist-row .d{color:var(--muted)}
.hist-row .s{font-weight:600}
.empty{font-size:14px;color:var(--muted);padding:8px 0}

/* ---------- rest timer ---------- */
.timer{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--ink);
  color:#fff;
  transform:translateY(110%);
  transition:transform .22s ease;
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  z-index:20;
}
.timer.on{transform:translateY(0)}
.timer-in{
  max-width:720px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
}
.timer .count{
  font-family:var(--display);
  font-size:42px;
  font-weight:700;
  line-height:1;
  color:var(--ball);
  min-width:78px;
}
.timer .lbl{
  font-family:var(--data);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#9FC4D6;
  flex:1;
}
.timer button{
  font-family:var(--display);
  text-transform:uppercase;
  font-size:16px;
  padding:9px 14px;
  background:transparent;
  border:2px solid var(--ball);
  color:var(--ball);
  border-radius:2px;
  cursor:pointer;
}
.bar{height:3px;background:#164C6C;margin-top:10px;max-width:720px;margin-left:auto;margin-right:auto}
.bar i{display:block;height:100%;background:var(--ball);width:100%}

/* ---------- articulations ---------- */
.dose-head{
  background:var(--card);
  border:2px solid var(--ink);
  border-radius:2px;
  padding:14px 12px;
  margin-top:14px;
}
.dose-row{display:flex;gap:8px;margin-top:10px}
.dose-row button{
  flex:1;
  font-family:var(--display);
  font-size:17px;
  font-weight:600;
  text-transform:uppercase;
  letter-spacing:.03em;
  padding:14px 4px;
  background:var(--card);
  border:2px solid var(--rail);
  border-radius:2px;
  color:var(--ink);
  cursor:pointer;
}
.dose-row button[aria-pressed="true"]{background:var(--ball);border-color:var(--ink)}
.dose-row button:focus-visible{outline:3px solid var(--line);outline-offset:2px}
.streak{
  font-family:var(--data);
  font-size:11px;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--muted);
  margin-top:10px;
}
.streak b{color:var(--line);font-size:15px}
.warn{
  margin-top:14px;
  background:#F6E4DB;
  border-left:4px solid var(--warn);
  padding:11px 12px;
  font-size:14px;
}
.warn b{font-weight:600}
.mob-when{
  font-family:var(--data);
  font-size:11px;
  color:var(--muted);
  margin-top:6px;
}

/* ---------- lien fiche SmartWorkout ---------- */
.swlink{
  display:inline-block;
  margin-top:9px;
  font-family:var(--data);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  color:var(--line);
  text-decoration:none;
  border-bottom:2px solid var(--rail);
  padding:2px 0;
}
.swlink:focus-visible{outline:3px solid var(--line);outline-offset:3px}
.swnone{
  margin-top:9px;
  font-family:var(--data);
  font-size:10px;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:var(--muted);
}

/* ---------- schémas position de départ ---------- */
.figbtn{
  margin-top:9px;
  font-family:var(--data);
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
  background:transparent;
  border:none;
  border-bottom:2px solid var(--ball);
  color:var(--line);
  padding:2px 0;
  cursor:pointer;
}
.figbtn:focus-visible{outline:3px solid var(--line);outline-offset:3px}
.figbox{display:none;margin-top:10px;background:#F2F7F9;border:2px solid var(--rail);border-radius:2px;padding:8px}
.figbox.on{display:block}
.figbox svg{width:100%;max-width:280px;display:block;margin:0 auto}
.figcap{font-size:13.5px;margin-top:6px}
.figleg{
  font-family:var(--data);font-size:10px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-top:6px;
  display:flex;gap:12px;flex-wrap:wrap;
}
.figleg i{display:inline-block;width:14px;height:0;border-top:3px solid var(--ball);vertical-align:middle;margin-right:4px}
.figleg u{display:inline-block;width:9px;height:9px;background:var(--ink);text-decoration:none;vertical-align:middle;margin-right:4px}
svg .b{fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
svg .hd{fill:none;stroke:var(--ink);stroke-width:2.6}
svg .band{fill:none;stroke:var(--ball);stroke-width:3;stroke-linecap:round}
svg .anch{fill:var(--ink)}
svg .gr{stroke:var(--rail);stroke-width:2}
svg .arr{fill:none;stroke:var(--muted);stroke-width:2;stroke-dasharray:4 3;marker-end:url(#ah)}
svg .traj{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:3 3}
svg text{font-family:var(--data);font-size:9px;fill:var(--muted)}
svg .be{fill:var(--ball)}
svg .br{fill:var(--rail)}
svg .flr{stroke:var(--ink);stroke-width:2.6;stroke-linecap:round}

.status{
  position:fixed;top:0;left:0;right:0;
  background:var(--ball);color:var(--ink);
  font-family:var(--data);font-size:12px;
  text-align:center;padding:7px;
  transform:translateY(-110%);
  transition:transform .2s;
  z-index:30;
}
.status.on{transform:translateY(0)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<div class="status" id="status"></div>

<header>
  <div class="wrap">
    <h1 class="brand">Prépa <span>padel</span></h1>
    <div class="tag">8 semaines · élastiques · 2 séances/semaine</div>
  </div>
</header>

<div class="wrap">
  <div class="controls">
    <div id="durWrap">
      <div class="ctl-label">Temps dispo aujourd'hui</div>
      <div class="seg" id="segDur"></div>
    </div>
    <div class="row2">
      <div>
        <div class="ctl-label">Séance</div>
        <select id="selSession">
          <option value="A">A — Haut du corps</option>
          <option value="B">B — Explosivité jambes</option>
          <option value="M">Articulations — hors séance</option>
        </select>
      </div>
      <div id="weekWrap">
        <div class="ctl-label">Semaine</div>
        <select id="selWeek"></select>
      </div>
    </div>
  </div>

  <div id="storageBadge" style="font-family:var(--data);font-size:11px;color:var(--muted);margin-top:10px;line-height:1.4"></div>

  <div class="note" id="note"></div>

  <div id="blocs"></div>

  <div class="actions">
    <button class="btn" id="btnFinish">Terminer la séance</button>
    <button class="btn ghost" id="btnReset">Décocher tout</button>
  </div>

  <div class="actions" id="dataActions" style="margin-top:18px">
    <button class="btn ghost" id="btnExport" style="font-size:15px">Exporter mes données</button>
    <button class="btn ghost" id="btnImport" style="font-size:15px">Importer</button>
    <input type="file" id="fileImport" accept="application/json" style="display:none">
  </div>

  <div class="hist">
    <h2>Séances enregistrées</h2>
    <div id="histList"></div>
  </div>
</div>

<div class="timer" id="timer">
  <div class="timer-in">
    <div class="count" id="tCount">0:00</div>
    <div class="lbl" id="tLabel">Repos</div>
    <button id="tStop">Passer</button>
  </div>
  <div class="bar"><i id="tBar"></i></div>
</div>

<script>
const KEY = 'padel-prep-v1';

/* `sw` = groupe musculaire de la page d'exercices SmartWorkout (site FR, videos en francais).
   Absence de `sw` = pas de page pertinente (pliometrie, cardio) : le schema de l'app fait foi. */
const SW_BASE = 'https://smartworkout-pro.com/pages/exercices-elastique-';
const SW_LESSON = 'https://smartworkout-pro.passion.io/app/products/115585/lessons/';
const SW_GROUPS = {pectoraux:'pectoraux', dos:'dos', epaule:'épaules', bras:'bras', abdos:'abdos', jambes:'jambes & fessiers'};

const PROGRAM = {
  A: [
    {bloc:'Échauffement', id:'planche', name:'Planche', detail:'activation', sets:{30:2}, reps:'30 s', tier:30, warm:true, sw:'abdos',
      note:'Activation, pas une série à l’échec : tu t’arrêtes à 30 s même si tu pouvais tenir plus. Un tronc épuisé dès le départ dégrade tout ce qui suit.'},
    {bloc:'Échauffement', id:'warm-arm-circles', name:'Cercles de bras', sets:{30:1}, reps:'10 avant / 10 arrière', tier:30, warm:true, sw:'epaule'},
    {bloc:'Échauffement', id:'warm-pass', name:'Passe-barre épaules élastique', detail:'élastique léger', sets:{30:1}, reps:'10', tier:30, warm:true, sw:'epaule'},
    {bloc:'Échauffement', id:'rot-ext', name:'Rotation externe d’épaule', detail:'coiffe des rotateurs', sets:{30:2}, reps:'15 / bras', tier:30, warm:true, sw:'epaule',
      note:'Jamais sautée, même en 30 min. C’est ce qui encaisse les smashes répétés.'},
    {bloc:'Rotation', id:'chop', name:'Chop diagonal élastique', detail:'ancrage haut', sets:{30:2,45:3,60:3}, reps:'10 / côté', rest:60, tier:30, sw:'abdos',
      note:'Le geste du smash. La puissance part des jambes et passe par le tronc : tu tournes les hanches, tu ne tires pas avec les bras.'},
    {bloc:'Force', id:'dev-couche', name:'Développé Debout', detail:'ancrage porte · poignées ou barre', sets:{30:3,45:4,60:4}, reps:'8–10', rest:90, tier:30, swid:'1963663', sw:'pectoraux'},
    {bloc:'Force', id:'tirage', name:'Tirage Horizontal Prise Large', detail:'ancrage hauteur nombril', sets:{30:3,45:4,60:4}, reps:'10–12', rest:90, tier:30, swid:'1963501', sw:'dos'},
    {bloc:'Force', id:'ecarte', name:'Écarté Poulie Haute', detail:'ancrage haut · poignées', sets:{30:2,45:3,60:3}, reps:'12–15', rest:60, tier:30, swid:'1963667', sw:'pectoraux',
      note:'Remplace les pompes : les poignées gardent le poignet dans l’axe, sans l’écrasement de l’appui au sol. Coudes légèrement fléchis et figés — c’est l’épaule qui ouvre et ferme, jamais le coude.'},
    {bloc:'Force', id:'dev-mil', name:'Développé Militaire Assis', detail:'assis, élastique sous les pieds', sets:{45:3,60:3}, reps:'10', rest:60, tier:45, swid:'1962143', sw:'epaule',
      note:'Assis, tu ne peux pas compenser en cambrant le bas du dos — c’est tout l’intérêt par rapport au debout. Si tu dois te pencher en arrière pour finir la rep, l’élastique est trop résistant.'},
    {bloc:'Gainage', id:'planche-lat', name:'Planche latérale', sets:{45:2,60:3}, reps:'30 s / côté', rest:45, tier:45, sw:'abdos'},
    {bloc:'Force', id:'face-pull', name:'Face Pull', detail:'ancrage au-dessus de la tête', sets:{60:3}, reps:'15', rest:45, tier:60, swid:'1962142', sw:'epaule'},
    {bloc:'Force', id:'curl', name:'Biceps Curl', detail:'coudes collés aux côtes', sets:{60:2}, reps:'12', rest:45, tier:60, swid:'1961995', sw:'bras'},
    {bloc:'Force', id:'triceps', name:'Triceps Extension Poulie Haute', detail:'coudes fixes', sets:{60:2}, reps:'12', rest:45, tier:60, swid:'1961565', sw:'bras'}
  ],
  B: [
    {bloc:'Échauffement', id:'planche', name:'Planche', detail:'activation', sets:{30:2}, reps:'30 s', tier:30, warm:true, sw:'abdos',
      note:'Activation, pas une série à l’échec. Un tronc pré-fatigué encaisse mal les réceptions de pliométrie.'},
    {bloc:'Échauffement', id:'warm-monster', name:'Abduction', detail:'élastique aux chevilles, pas latéraux', sets:{30:1}, reps:'20 pas', tier:30, warm:true, swid:'1961935', sw:'jambes',
      note:'Réveille les fessiers et la stabilité latérale du genou — exactement ce que la pliométrie va solliciter.'},
    {bloc:'Échauffement', id:'warm-squat', name:'Squat', detail:'à vide, sans élastique', sets:{30:1}, reps:'15', tier:30, warm:true, swid:'1962158', sw:'jambes'},
    {bloc:'Échauffement', id:'warm-lunge', name:'Fentes', detail:'avec rotation du buste', sets:{30:1}, reps:'5 / côté', tier:30, warm:true, swid:'1962000', sw:'jambes'},
    {bloc:'Pliométrie', id:'squat-jump', name:'Squat jumps', sets:{30:3,45:3,60:4}, reps:'6', rest:90, tier:30},

  7:'Semaines 7–8 : tempo excentrique lent, <strong>3 s à la descente</strong> sur développé et tirage.',
  9:'Semaine 9 : décharge à <strong>50 % du volume</strong>, puis on réévalue les repères.'
};
function weekNote(w){
  if(w<=2) return WEEK_NOTES[1];
  if(w<=4) return WEEK_NOTES[3];
  if(w<=6) return WEEK_NOTES[5];
  if(w<=8) return WEEK_NOTES[7];
  return WEEK_NOTES[9];
}
function effSets(base, week){
  if(!base) return 0;
  if(week<=2) return Math.max(2, base-1);
  if(week>=9) return Math.max(1, Math.round(base/2));
  return base;
}

let state = {duration:45, session:'A', week:1, checked:{}, logs:{}, history:[], daily:{}};

function flash(msg){
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(flash._t);
  flash._t = setTimeout(()=>el.classList.remove('on'), 1800);
}

/* ---------- persistance (localStorage) ---------- */
let storageMode = 'inconnu';
let storageDetail = '';
let lastSaved = null;

function hasStorage(){
  try{
    const t = '__t'+Date.now();
    window.localStorage.setItem(t,'1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){
    storageDetail = (e && e.name === 'SecurityError')
      ? 'stockage bloqué par le navigateur (navigation privée ?)'
      : ((e && e.message) ? String(e.message).slice(0,80) : 'cause inconnue');
    return false;
  }
}

function setStorageBadge(){
  const el = document.getElementById('storageBadge');
  if(!el) return;
  if(storageMode === 'ok'){
    el.innerHTML = '<span style="color:var(--line)">●</span> Données enregistrées sur cet appareil';
  } else if(storageMode === 'absent'){
    el.innerHTML = '<span style="color:var(--warn)">●</span> Stockage indisponible · ' + storageDetail
      + ' — tes saisies ne survivront pas à la fermeture';
  } else if(storageMode === 'erreur'){
    el.innerHTML = '<span style="color:var(--warn)">●</span> Échec d\'écriture · ' + storageDetail;
  } else {
    el.innerHTML = '';
  }
}

function load(){
  if(!hasStorage()){ storageMode = 'absent'; render(); return; }
  try{
    const raw = window.localStorage.getItem(KEY);
    if(raw) state = Object.assign(state, JSON.parse(raw));
    storageMode = 'ok';
  }catch(e){
    storageMode = 'ok';   // donnée illisible : on repart d'un état neuf sans bloquer
  }
  lastSaved = JSON.stringify(state);
  render();
}

let saveT;
function save(){
  if(storageMode === 'absent'){ setStorageBadge(); return; }
  clearTimeout(saveT);
  saveT = setTimeout(doSave, 400);
}

function doSave(){
  const payload = JSON.stringify(state);
  if(payload === lastSaved) return;
  try{
    window.localStorage.setItem(KEY, payload);
    lastSaved = payload;
    storageMode = 'ok';
  }catch(e){
    storageDetail = (e && e.name === 'QuotaExceededError')
      ? 'espace de stockage saturé'
      : ((e && e.message) ? String(e.message).slice(0,80) : 'cause inconnue');
    storageMode = 'erreur';
  }
  setStorageBadge();
}

/* ---------- export / import ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'prepa-padel-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function importData(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      state = Object.assign(state, JSON.parse(r.result));
      lastSaved = null; doSave(); render();
      flash('Données importées');
    }catch(e){ flash('Fichier illisible'); }
  };
  r.readAsText(file);
}

/* ---------- render ---------- */
function render(){
  setStorageBadge();
  const isM = state.session === 'M';
  document.getElementById('durWrap').style.display = isM ? 'none' : '';
  document.getElementById('weekWrap').style.display = isM ? 'none' : '';
  document.getElementById('note').style.display = isM ? 'none' : '';
  document.querySelector('.actions').style.display = isM ? 'none' : '';
  // #dataActions reste toujours visible
  document.getElementById('selSession').value = state.session;
  if(isM){ renderMobility(); renderHistory(); return; }

  const segDur = document.getElementById('segDur');
  segDur.innerHTML = DURATIONS.map(d=>
    `<button data-dur="${d.v}" aria-pressed="${state.duration===d.v}">${d.v} min<span class="sub">${d.real[state.session]}</span></button>`
  ).join('');
  segDur.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    state.duration = +b.dataset.dur; save(); render();
  });

  const selW = document.getElementById('selWeek');
  if(!selW.options.length){
    for(let i=1;i<=9;i++){
      const o=document.createElement('option'); o.value=i; o.textContent='Semaine '+i; selW.appendChild(o);
    }
  }
  selW.value = state.week;
  document.getElementById('selSession').value = state.session;
  document.getElementById('note').innerHTML = weekNote(state.week);

  const list = PROGRAM[state.session];
  const inFormat = list.filter(e=>e.tier<=state.duration);
  const beyond = list.filter(e=>e.tier>state.duration);
  const host = document.getElementById('blocs');
  host.innerHTML = '';

  BLOC_ORDER[state.session].forEach(bloc=>{
    const items = inFormat.filter(e=>e.bloc===bloc);
    if(!items.length) return;
    const sec = document.createElement('section');
    sec.className = 'bloc';
    const order = BLOC_META[bloc] || '';
    sec.innerHTML = `<div class="bloc-head"><h2>${bloc}</h2><div class="meta">${order}</div></div>
      <div class="rail"></div>`;
    const rail = sec.querySelector('.rail');
    items.forEach(e=>rail.appendChild(exCard(e,false)));
    host.appendChild(sec);
  });

  if(beyond.length){
    const sec = document.createElement('section');
    sec.className = 'bloc';
    sec.innerHTML = `<div class="cut"><span>Au-delà de ${state.duration} min · ${beyond.length} exercice${beyond.length>1?'s':''}</span></div><div class="rail"></div>`;
    const rail = sec.querySelector('.rail');
    beyond.forEach(e=>rail.appendChild(exCard(e,true)));
    host.appendChild(sec);
  }

  renderHistory();
}

function exCard(e, isBeyond){
  const key = state.session+'|'+e.id;
  const base = e.sets[state.duration] || e.sets[e.tier];
  // l'échauffement garde son volume tel quel : ni allégé en semaine 1-2, ni réduit en décharge
  const s = (isBeyond || e.warm) ? base : effSets(base, state.week);
  const done = !!state.checked[key];
  const log = state.logs[key];

  const div = document.createElement('div');
  div.className = 'ex' + (done?' done':'') + (isBeyond?' beyond':'');
  div.innerHTML = `
    <div class="ex-top">
      <div class="ex-name">${e.name}${e.detail?` <span style="font-family:var(--body);font-size:13px;font-weight:400;color:var(--muted)">${e.detail}</span>`:''}</div>
      ${isBeyond?'':`<button class="chk" aria-pressed="${done}" aria-label="Marquer comme fait">${done?'✓':''}</button>`}
    </div>
    <div class="presc">
      <span class="pill sets">${s} × ${e.reps}</span>
      ${workSecs(e.reps)?`<button class="pill work" data-work="${workSecs(e.reps)}">chrono ${workSecs(e.reps)} s ▸</button>`:''}
      ${e.rest?`<button class="pill rest" data-rest="${e.rest}">repos ${e.rest} s ▸</button>`:''}
    </div>
    ${e.note?`<div class="ex-note">${e.note}</div>`:''}
    ${e.swid
      ? `<a class="swlink" href="${SW_LESSON}${e.swid}" target="_blank" rel="noopener noreferrer">Vidéo SmartWorkout ↗</a>`
      : e.sw
        ? `<a class="swlink" href="${SW_BASE}${e.sw}" target="_blank" rel="noopener noreferrer">Exercices ${SW_GROUPS[e.sw]} SmartWorkout ↗</a>`
        : '<div class="swnone">Pas de vidéo SmartWorkout — voir le schéma</div>'}
    ${FIGURES[e.id]?`
    <button class="figbtn" aria-expanded="false">▸ Position de départ</button>
    <div class="figbox">
      ${SVG_HEAD}${FIGURES[e.id].svg}</svg>
      <div class="figcap">${FIGURES[e.id].cap}</div>
      <div class="figleg">${figLegend(FIGURES[e.id].svg)}</div>
    </div>`:''}
    ${(isBeyond||e.warm)?'':`
    <div class="inputs">
      <label><div class="ctl-label">Élastique / charge</div>
        <input type="text" data-f="load" placeholder="ex. rouge ×2" value="${log&&log.load?escapeAttr(log.load):''}"></label>
      <label><div class="ctl-label">Reps tenues</div>
        <input type="text" inputmode="numeric" data-f="reps" placeholder="—" value="${log&&log.reps?escapeAttr(log.reps):''}"></label>
    </div>
    <div class="last">${log&&log.date?`Dernière fois · <b>${log.load||'—'}</b> · ${log.reps||'—'} reps · ${fmtDate(log.date)}`:'Pas encore de repère enregistré'}</div>`}
  `;

  const chk = div.querySelector('.chk');
  if(chk) chk.onclick = ()=>{
    state.checked[key] = !state.checked[key];
    save(); render();
  };
  const fb = div.querySelector('.figbtn');
  if(fb) fb.onclick = ()=>{
    const box = div.querySelector('.figbox');
    const open = box.classList.toggle('on');
    fb.setAttribute('aria-expanded', open);
    fb.textContent = (open?'▾ ':'▸ ') + 'Position de départ';
  };
  div.querySelectorAll('.rest').forEach(b=>b.onclick=()=>startRest(+b.dataset.rest, e.name));
  div.querySelectorAll('.work').forEach(b=>b.onclick=()=>startWork(+b.dataset.work, e.name));
  div.querySelectorAll('input').forEach(inp=>{
    inp.onchange = ()=>{
      const cur = state.logs[key] || {};
      cur[inp.dataset.f] = inp.value.trim();
      cur.date = new Date().toISOString();
      state.logs[key] = cur;
      save();
      const l = div.querySelector('.last');
      if(l) l.innerHTML = `Dernière fois · <b>${cur.load||'—'}</b> · ${cur.reps||'—'} reps · ${fmtDate(cur.date)}`;
    };
  });
  return div;
}

/* ---------- articulations ---------- */
function todayKey(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function dayKeyFrom(offset){
  const d = new Date(); d.setDate(d.getDate()-offset);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function streak(){
  state.daily = state.daily || {};
  let n = 0;
  for(let i=0;i<400;i++){
    if((state.daily[dayKeyFrom(i)]||0) > 0) n++;
    else if(i>0) break;
    else continue;
  }
  return n;
}
function renderMobility(){
  state.daily = state.daily || {};
  const today = state.daily[todayKey()] || 0;
  const host = document.getElementById('blocs');
  host.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'dose-head';
  head.innerHTML = `
    <div class="ctl-label">Doses du jour · objectif 3</div>
    <div class="dose-row">
      ${[1,2,3].map(i=>`<button data-d="${i}" aria-pressed="${today>=i}">${today>=i?'✓ ':''}Dose ${i}</button>`).join('')}
    </div>
    <div class="streak">Jours d'affilée · <b>${streak()}</b></div>
    <div class="warn">
      <b>Ces exercices entretiennent, ils ne soignent pas.</b> Ils se font sur une articulation qui ne fait pas mal
      au moment où tu les fais. Une douleur qui dure plusieurs semaines, qui réveille la nuit ou qui gonfle
      mérite un avis médical — un kiné ou un médecin du sport identifiera si c'est tendineux, articulaire ou
      lié à ta technique. Ne cherche jamais à passer à travers une douleur vive.
    </div>`;
  head.querySelectorAll('.dose-row button').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.d;
    state.daily[todayKey()] = (today>=i) ? i-1 : i;
    save(); render();
  });
  host.appendChild(head);

  const intro = document.createElement('div');
  intro.className = 'note';
  intro.style.display = '';
  intro.innerHTML = `Routine de 2 à 3 min, sans matériel, à caser <strong>2 à 3 fois par jour</strong>.
    Pour les tendons et les articulations, la fréquence bat l'intensité : mieux vaut trois passages courts
    tous les jours qu'une grosse séance hebdo. Aucun de ces exercices ne fatigue — ils ne perturbent ni ton
    padel ni tes séances A et B.`;
  host.appendChild(intro);

  MOB_BLOCS.forEach(bloc=>{
    const items = MOBILITY.filter(e=>e.bloc===bloc);
    const sec = document.createElement('section');
    sec.className = 'bloc';
    sec.innerHTML = `<div class="bloc-head"><h2>${bloc}</h2><div class="meta">${items.length} exercices</div></div><div class="rail"></div>`;
    const rail = sec.querySelector('.rail');
    items.forEach(e=>{
      const div = document.createElement('div');
      div.className = 'ex';
      div.innerHTML = `
        <div class="ex-top"><div class="ex-name">${e.name}</div></div>
        <div class="presc"><span class="pill sets">${e.presc}</span></div>
        <div style="margin-top:8px;font-size:14px">${e.detail}</div>
        <div class="mob-when">Quand · ${e.when}</div>`;
      rail.appendChild(div);
    });
    host.appendChild(sec);
  });
}

function figLegend(svg){
  const parts = [];
  if(svg.includes('class="band"')) parts.push('<span><i></i>élastique</span>');
  if(svg.includes('class="anch"')) parts.push('<span><u></u>appui / ancrage</span>');
  if(svg.includes('class="arr"')) parts.push('<span>⇢ sens du mouvement</span>');
  if(svg.includes('class="traj"')) parts.push('<span>┈ trajectoire ou repère</span>');
  return parts.join('');
}

/**
 * Duree d'une serie chronometree, en secondes ('40 s', '30 s / côté' -> 30).
 * Renvoie 0 pour une prescription en repetitions, qui n'a pas de chrono.
 */
function workSecs(reps){
  const m = String(reps).match(/^(\d+)\s*s(\s|$)/);
  return m ? +m[1] : 0;
}

function escapeAttr(s){ return String(s).replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'});
}

function renderHistory(){
  const host = document.getElementById('histList');
  const h = (state.history||[]).slice(-8).reverse();
  if(!h.length){ host.innerHTML = '<div class="empty">Termine une séance pour la voir apparaître ici.</div>'; return; }
  host.innerHTML = h.map(x=>`<div class="hist-row">
    <span class="d">${fmtDate(x.date)}</span>
    <span class="s">Séance ${x.session}</span>
    <span>${x.duration} min · S${x.week}</span>
    <span style="margin-left:auto">${x.done} exos</span>
  </div>`).join('');
}

/* ---------- rest timer ---------- */
let tInt = null, tEnd = 0, wakeLock = null, actx = null;

/**
 * Garde l'ecran allume pendant un decompte. Le verrou saute des que la page
 * passe en arriere-plan : il est repris par le listener visibilitychange.
 */
async function keepAwake(){
  try{
    if('wakeLock' in navigator && !wakeLock){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock = null; });
    }
  }catch(e){ /* refuse ou non supporte : le decompte fonctionne quand meme */ }
}
function releaseAwake(){
  try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && tInt) keepAwake();
});

/** Prepare le contexte audio pendant le geste utilisateur (sinon il reste suspendu). */
function ensureAudio(){
  try{
    const C = window.AudioContext || window.webkitAudioContext;
    if(!C) return;
    if(!actx) actx = new C();
    if(actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function endSignal(){
  try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
  try{
    if(!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = 880;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.0001, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, actx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.6);
    o.start(); o.stop(actx.currentTime + 0.6);
  }catch(e){}
}

/**
 * Decompte unique pour le repos et les exercices chronometres.
 * L'echeance est une date absolue : l'affichage reste juste meme si le
 * navigateur bride les timers en arriere-plan.
 * @param {number} sec duree en secondes
 * @param {string} label nom de l'exercice
 * @param {'rest'|'work'} kind
 */
function startTimer(sec, label, kind){
  clearInterval(tInt);
  ensureAudio();
  const box = document.getElementById('timer');
  const cnt = document.getElementById('tCount');
  const bar = document.getElementById('tBar');
  document.getElementById('tLabel').textContent = (kind === 'work' ? '' : 'Repos · ') + label;
  box.classList.add('on');
  keepAwake();
  tEnd = Date.now() + sec * 1000;
  const tick = ()=>{
    const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
    cnt.textContent = Math.floor(left/60) + ':' + String(left%60).padStart(2,'0');
    bar.style.width = (left / sec * 100) + '%';
    if(left <= 0){
      clearInterval(tInt); tInt = null;
      document.getElementById('tLabel').textContent =
        kind === 'work' ? 'Série terminée — repos' : 'Repos terminé — série suivante';
      endSignal();
      releaseAwake();
    }
  };
  tick();
  tInt = setInterval(tick, 250);
}
const startRest = (sec, label)=> startTimer(sec, label, 'rest');
const startWork = (sec, label)=> startTimer(sec, label, 'work');

document.getElementById('tStop').onclick = ()=>{
  clearInterval(tInt); tInt = null;
  releaseAwake();
  document.getElementById('timer').classList.remove('on');
};

/* ---------- actions ---------- */
document.getElementById('selSession').onchange = (ev)=>{
  const v = ev.target.value;
  if(v !== 'M' && state.session !== 'M') state.checked = {};
  state.session = v; save(); render();
};
document.getElementById('selWeek').onchange = (ev)=>{
  state.week = +ev.target.value; save(); render();
};
document.getElementById('btnReset').onclick = ()=>{
  state.checked = {}; save(); render();
};
document.getElementById('btnFinish').onclick = ()=>{
  const done = Object.values(state.checked).filter(Boolean).length;
  if(!done){ flash('Coche au moins un exercice avant de terminer'); return; }
  state.history = state.history || [];
  state.history.push({date:new Date().toISOString(), session:state.session, duration:state.duration, week:state.week, done});
  state.checked = {};
  save(); render();
  flash('Séance enregistrée · ' + done + ' exercices');
  window.scrollTo({top:0,behavior:'smooth'});
};

document.getElementById('btnExport').onclick = exportData;
document.getElementById('btnImport').onclick = ()=>document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = (ev)=>{
  if(ev.target.files && ev.target.files[0]) importData(ev.target.files[0]);
  ev.target.value = '';
};

load();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* hors ligne indisponible, l'app fonctionne quand même */ });
  });
}
</script>
